name: Update Match Notifications  

on:
  schedule:
    - cron: '5 18,0,6,12 * * *'  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2
          pip install requests pytz Pillow cairosvg

      - name: Clean old posters
        run: |
          rm -rf posters/*
          mkdir -p posters

      - name: Generate notifications.json and Posters
        env:
          DEFAULT_IMAGE: "https://i.postimg.cc/2jPs7rBr/HOME-LIVE-EVENT.png"
          SUBTITLE_SUFFIX: " | Select 🅻🅸🅅🅴 🆂🅿🅾🆁🆃🆂 Button, Share Our Apps With Your Friends & Family."
          SonyLiv_API: ${{ secrets.SonyLiv_API }}
          FANCEODE_API: ${{ secrets.FANCEODE_API }}
          TAPMAD_API: ${{ secrets.TAPMAD_API }}
        run: python generate_matches.py

      - name: Commit and push notifications.json and Posters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add notifications.json
          git add -A posters/
          git commit -m "Auto-update notifications and posters ($(TZ=Asia/Dhaka date +'%d-%m-%Y %H:%M'))" || echo "No changes"
          git push
